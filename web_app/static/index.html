<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tripo3D Matching 3D Segmentation & Explosion Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="brand-badge glass">
      <div class="brand-logo">3D</div>
      <div class="brand-title">
        <h1 id="model-title-text">Tripo3D Matching Web Studio</h1>
        <p>P3-SAM + X-Part PartFormer DiffDMC GPU Pipeline</p>
      </div>
    </div>

    <div class="header-actions">
      <input type="file" id="file-input" accept=".glb,.obj,.ply">
      <button id="upload-btn" class="action-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
        </svg>
        Upload 3D Mesh
      </button>
      <button id="download-assembly-btn" class="action-btn" title="Download Multi-Node Assembly GLB">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
        Export Assembly GLB
      </button>
      <button id="download-exploded-btn" class="action-btn" title="Download Pre-exploded GLB">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/>
        </svg>
        Export Exploded GLB
      </button>
    </div>
  </header>

  <!-- Left Drawer: Presets & Pipeline Controls -->
  <aside class="pipeline-drawer glass">
    <div>
      <div class="section-title">
        <span>Sample Models</span>
        <span style="font-size: 11px; color: var(--text-muted);">Click to load</span>
      </div>
      <div id="presets-list" class="preset-chip-list">
        <div style="font-size: 12px; color: var(--text-muted); padding: 8px;">Loading presets...</div>
      </div>
    </div>

    <hr style="border: 0; border-top: 1px solid var(--surface-border-subtle);">

    <div>
      <div class="section-title">
        <span>Pipeline Parameters</span>
      </div>

      <div class="param-group" style="margin-bottom: 12px;">
        <label class="param-label">
          <span>Marching Cubes Algo</span>
          <span style="color: var(--success-green); font-family: monospace;">82 ms (70× faster)</span>
        </label>
        <select id="mc-algo-select" class="param-select">
          <option value="dmc" selected>GPU DiffDMC (CUDA Extension)</option>
          <option value="mc">CPU Scikit-Image (Slow Fallback)</option>
        </select>
      </div>

      <div class="param-group" style="margin-bottom: 12px;">
        <label class="param-label">
          <span>Diffusion Sampling Steps</span>
          <span id="steps-val-display" style="font-family: monospace;">50</span>
        </label>
        <select id="steps-select" class="param-select">
          <option value="50" selected>50 Steps (Maximum Quality)</option>
          <option value="20">20 Steps (Fast Preview)</option>
        </select>
      </div>

      <div class="param-group" style="margin-bottom: 16px;">
        <label class="param-label">
          <span>Grid Resolution</span>
          <span style="font-family: monospace;">512³</span>
        </label>
        <select id="res-select" class="param-select">
          <option value="512" selected>512³ (Lossless Sharp Geometry)</option>
          <option value="256">256³ (Draft Preview)</option>
        </select>
      </div>

      <button id="run-pipeline-btn" class="action-btn primary" style="width: 100%; justify-content: center; padding: 12px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Run Full Part Segmentation
      </button>
    </div>
  </aside>

  <!-- Floating Pipeline Progress Banner -->
  <div id="progress-banner" class="progress-banner glass">
    <div class="progress-header">
      <span id="progress-stage-text">Step 1/3: Running P3-SAM Estimation...</span>
      <span id="progress-percent-text">25%</span>
    </div>
    <div class="progress-bar-bg">
      <div id="progress-bar-fill" class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Right Drawer: Tripo3D Parts Hierarchy -->
  <aside class="parts-drawer glass">
    <div class="parts-header">
      <span style="font-size: 14px; font-weight: 600;">Parts Hierarchy</span>
      <span id="part-count" class="parts-count">0 PARTS</span>
    </div>
    <div id="parts-container" class="parts-list">
      <div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 20px;">
        Load a segmented model to view parts
      </div>
    </div>
  </aside>

  <!-- Bottom Floating Tripo3D Explosion Controls -->
  <div class="controls-panel glass">
    <button id="explode-toggle" class="explode-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <span id="explode-text">Explode</span>
    </button>
    <div class="slider-group">
      <label>Displacement:</label>
      <input type="range" id="explode-slider" min="0" max="1" step="0.005" value="0">
    </div>
    <div class="slider-group" style="margin-left: 8px;">
      <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
        <input type="checkbox" id="tumbling-toggle" checked style="accent-color: #6366f1; cursor: pointer;">
        <span>3D Tumbling</span>
      </label>
    </div>
  </div>

  <!-- 3D Viewport Canvas Container -->
  <div id="canvas-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
